# FSD §3 — CI: tests + build on every push/PR. Deployment is handled by the
# hosting provider's auto-deploy on merge to main (Render/Railway).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          SESSION_SECRET: "ci-only-secret-string-at-least-32-chars-long"
